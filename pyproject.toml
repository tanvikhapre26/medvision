[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name= "medvision"
version= "0.1.0"
description= "A PyTorch library for medical image classification - X-ray and MRI"
readme= "README.md"
requires-python = ">=3.8"
license = {text= "MIT"}

[project.urls]
Homepage = "https://github.com/tanvikhapre26/medvision"

[tool.setuptools.packages.find]
where = ["."]
include = ["medvision*"]